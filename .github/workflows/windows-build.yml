name: Build ChartMate Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build and audit installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -CI

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ChartMate-Windows-x64
          path: dist/ChartMate-Setup-*-win-x64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
